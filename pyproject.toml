[project]
name = "aihorizons-pizza-catalog"
version = "0.1.0"
description = "Read-only pizza catalog MCP demo"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.7.0,<3",
    "azure-identity>=1.25.3,<2",
    "mcp>=2.2.0,<3",
    "psycopg[binary]>=3.3.5,<4",
    "starlette>=1.6.0,<2",
    "uvicorn>=0.53.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pizza_mcp"]

[[tool.uv.index]]
name = "microsoft"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
